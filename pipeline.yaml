# azure-pipelines.yml
trigger:
  branches:
    include:
      - main

parameters:
- name: operation
  displayName: 'Terraform operation'
  type: string
  default: 'apply'
  values:
    - apply
    - destroy

stages:
- stage: Terraform
  displayName: 'Terraform Deployment'
  jobs:
  - job: TerraformRun
    displayName: 'Run Terraform for ADBS'
    pool:
      #name: Default
      vmImage: 'ubuntu-latest'

    steps:
    # Step 1: Install the Terraform CLI
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.9.2'

    # Step 2: Initialize Terraform (Configures Backend State)
    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: '$(AZURE_SERVICE_CONNECTION_NAME)'
        backendAzureRmResourceGroupName: '$(AZURE_RM_GROUP_NAME)'
        backendAzureRmStorageAccountName: '$(AZURE_RM_GROUP_NAME)'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'terraform.tfstate'

    # Step 3a: Create an execution plan for apply
    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan (Apply)'
      condition: and(succeeded(), eq('${{ parameters.operation }}', 'apply'))
      inputs:
        provider: 'azurerm'
        command: 'plan'
        commandOptions: '-var-file="dev.tfvars" -out=tfplan'
        environmentServiceNameAzureRM: '$(AZURE_SERVICE_CONNECTION_NAME)'

    # Step 4a: Apply the execution plan
    - task: TerraformTaskV4@4
      displayName: 'Terraform Apply'
      condition: and(succeeded(), eq('${{ parameters.operation }}', 'apply'))
      inputs:
        provider: 'azurerm'
        command: 'apply'
        commandOptions: '-auto-approve tfplan'
        environmentServiceNameAzureRM: '$(AZURE_SERVICE_CONNECTION_NAME)'

    # Safety guard: block destroy when pipeline was not started manually
    - script: |
        echo "Destroy is only allowed for manual pipeline runs."
        echo "Current Build.Reason=$(Build.Reason)"
        exit 1
      displayName: 'Guard: Block destroy on non-manual runs'
      condition: and(succeeded(), eq('${{ parameters.operation }}', 'destroy'), ne(variables['Build.Reason'], 'Manual'))

    # Step 3b: Create a destroy plan
    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan (Destroy)'
      condition: and(succeeded(), eq('${{ parameters.operation }}', 'destroy'), eq(variables['Build.Reason'], 'Manual'))
      inputs:
        provider: 'azurerm'
        command: 'plan'
        commandOptions: '-destroy -var-file="dev.tfvars" -out=tfdestroyplan'
        environmentServiceNameAzureRM: '$(AZURE_SERVICE_CONNECTION_NAME)'

    # Step 4b: Apply the destroy plan
    - task: TerraformTaskV4@4
      displayName: 'Terraform Destroy'
      condition: and(succeeded(), eq('${{ parameters.operation }}', 'destroy'), eq(variables['Build.Reason'], 'Manual'))
      inputs:
        provider: 'azurerm'
        command: 'apply'
        commandOptions: '-auto-approve tfdestroyplan'
        environmentServiceNameAzureRM: '$(AZURE_SERVICE_CONNECTION_NAME)'
