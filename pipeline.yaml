# azure-pipelines.yml
trigger:
  branches:
    include:
      - main

stages:
- stage: Terraform
  displayName: 'Terraform Deployment'
  jobs:
  - job: TerraformApply
    displayName: 'Apply Terraform for ADBS'
    pool:
      #name: Default
      vmImage: 'ubuntu-latest'

    steps:
    # Step 1: Install the Terraform CLI
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.9.2'

    # Step 2: Initialize Terraform (Configures Backend State)
    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: '$(AZURE_SERVICE_CONNECTION_NAME)'
        backendAzureRmResourceGroupName: '$(AZURE_RM_GROUP_NAME)'
        backendAzureRmStorageAccountName: '$(AZURE_RM_GROUP_NAME)'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'terraform.tfstate'

    # Step 3: Create an Execution Plan
    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        commandOptions: '-var-file="dev.tfvars" -out=tfplan'
        environmentServiceNameAzureRM: '$(AZURE_SERVICE_CONNECTION_NAME)'

    # Step 4: Apply the Changes
    - task: TerraformTaskV4@4
      displayName: 'Terraform Apply'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        commandOptions: '-auto-approve tfplan'
        environmentServiceNameAzureRM: '$(AZURE_SERVICE_CONNECTION_NAME)'

    # Step 5. Plan destroy All
    #- task: TerraformTaskV4@4
