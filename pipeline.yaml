    #  inputs:
    #    provider: 'azurerm'
    #    command: 'plan'
    #    commandOptions: '-destroy -out=tfdestroyplan -var-file="dev.tfvars"'
    #    environmentServiceNameAzureRM: '$(AZURE_SERVICE_CONNECTION_NAME)'

